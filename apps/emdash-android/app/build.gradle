plugins {
    id 'com.android.application'
}

android {
    namespace 'com.emdash.remote'
    compileSdk 36

    defaultConfig {
        applicationId 'com.emdash.fork.remote'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
