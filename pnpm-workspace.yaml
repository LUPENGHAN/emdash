packages:
  - 'apps/*'
  - 'packages/**'

# A Latin word after a full-width opening bracket ("（brute force）") broke per letter in
# the chat's text layout; see the patch.
# ssh2: OpenSSH certificates from the SSH agent (upstream also lists it in package.json,
# which this pnpm no longer reads).
patchedDependencies:
  '@chenglou/pretext@0.0.8': patches/@chenglou__pretext@0.0.8.patch
  ssh2@1.17.0: patches/ssh2@1.17.0.patch
